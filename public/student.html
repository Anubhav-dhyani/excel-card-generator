<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Pass</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0c;
  --card: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.14);
  --text: rgba(255, 255, 255, 0.94);
  --muted: rgba(255, 255, 255, 0.7);
  --ok: #22c55e;
  --bad: #ef4444;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Geist', system-ui, sans-serif;
  min-height: 100vh;
  padding: 24px;
  display: grid;
  place-items: center;
  background:
    radial-gradient(900px 600px at 20% 10%, rgba(239, 68, 68, 0.24), transparent 50%),
    radial-gradient(900px 700px at 80% 0%, rgba(99, 102, 241, 0.18), transparent 55%),
    var(--bg);
  color: var(--text);
}

.card {
  width: min(100%, 520px);
  padding: 28px;
  border-radius: 24px;
  border: 1px solid var(--border);
  background: linear-gradient(180deg, var(--card), rgba(255, 255, 255, 0.03));
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
  text-align: center;
  backdrop-filter: blur(12px);
}

.status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 18px;
}

.status.ok {
  background: rgba(34, 197, 94, 0.14);
  border: 1px solid rgba(34, 197, 94, 0.35);
  color: #bbf7d0;
}

.status.err {
  background: rgba(239, 68, 68, 0.14);
  border: 1px solid rgba(239, 68, 68, 0.35);
  color: #fecaca;
}

.name {
  font-size: clamp(32px, 8vw, 54px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.03em;
}

.note {
  margin-top: 14px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.5;
}

.loading {
  display: grid;
  gap: 14px;
  justify-items: center;
  color: var(--muted);
}

.spinner {
  width: 42px;
  height: 42px;
  border: 3px solid rgba(255, 255, 255, 0.12);
  border-top-color: rgba(255, 255, 255, 0.82);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<main class="card">
  <div id="content" class="loading">
    <div class="spinner"></div>
    <div>Checking pass...</div>
  </div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (token) {
  loadVerified(token);
} else {
  showState(false, '', 'Missing verification token.');
}

async function loadVerified(t) {
  try {
    const res = await fetch(`/api/verify?token=${encodeURIComponent(t)}`);
    const data = await res.json();
    if (!res.ok || !data.verified || !data.student?.name) {
      throw new Error(data.error || 'Verification failed');
    }

    showState(true, data.student.name, 'Verified entry pass');
  } catch (err) {
    showState(false, '', err.message || 'Invalid or expired pass');
  }
}

function showState(verified, name, note) {
  document.getElementById('content').innerHTML = verified
    ? `
      <div class="status ok">Verified</div>
      <div class="name">${escapeHtml(name)}</div>
      <div class="note">${escapeHtml(note)}</div>
    `
    : `
      <div class="status err">Not Verified</div>
      <div class="note">${escapeHtml(note)}</div>
    `;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text ?? '');
  return div.innerHTML;
}
</script>

</body>
</html>
